<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">CORETEX visual prototype overview</title>
  <desc id="desc">A monochrome brutalist interface showing a graph workspace, inspector, chat, timeline, and file library.</desc>
